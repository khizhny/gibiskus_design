<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <title>Пошук фахівця - створення акаунта</title>
    <meta
      name="description"
      content="Реєстрація нового користувача через Google або email."
    />
    <link rel="stylesheet" href="styles.css?v=typography-20260920" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Пошук фахівця, на головну">
        <span class="brand-logo" aria-hidden="true"><img src="assets/logo.png" alt="" /></span>
      </a>
      <button class="menu-button icon-button" type="button" data-menu-toggle aria-label="Відкрити меню">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" data-nav>
        <a href="index.html">Шукаю фахівця</a>
        <a href="specialists.html">Я фахівець</a>
        <a href="about.html">Про сайт</a>
        <a href="admin.html">Адміністратор</a>
      </nav>
      <div class="header-actions">
        <a class="ghost-button" href="auth.php">Увійти</a>
      </div>
    </header>

    <main>
      <section class="auth-layout registration-layout" id="auth">
        <div class="auth-intro">
          <h1>Створення акаунта</h1>
        </div>

        <section class="auth-panel" aria-label="Форма реєстрації">
          <form class="registration-profile" id="registrationProfileForm">
            <div class="field-grid">
              <label>
                <span>Ім'я</span>
                <input type="text" name="firstName" autocomplete="given-name" required />
              </label>
              <label>
                <span>Прізвище</span>
                <input type="text" name="lastName" autocomplete="family-name" required />
              </label>
            </div>
            <label class="checkbox-row registration-consent">
              <input type="checkbox" name="privacyAccepted" required />
              <span>Погоджуюсь з <a href="privacy.html" target="_blank" rel="noopener">політикою конфіденційності</a>.</span>
            </label>
          </form>

          <div class="registration-methods" id="registrationMethodSection" hidden>
            <div class="registration-method-options">
              <div class="registration-email-option">
                <form class="registration-email-form" id="emailAuthForm" aria-label="Реєстрація за email">
                  <label>
                    <span>Email</span>
                    <input type="email" name="email" autocomplete="email" placeholder="name@example.com" required />
                  </label>
                  <label>
                    <span>Пароль</span>
                    <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required />
                  </label>
                  <label>
                    <span>Повторіть пароль</span>
                    <input type="password" name="passwordConfirm" autocomplete="new-password" minlength="8" maxlength="128" required />
                  </label>
                </form>

                <button
                  class="primary-button auth-email-submit"
                  id="emailRegistrationSubmit"
                  type="submit"
                  form="emailAuthForm"
                >
                  Зареєструватися через email
                </button>
              </div>

              <div class="registration-method-divider" aria-hidden="true">або</div>

              <div class="registration-google-option">
                <div class="google-auth-mount" id="googleAuthButton" aria-live="polite"></div>
                <p class="auth-provider-note" id="googleAuthNote"></p>
              </div>
            </div>
          </div>

          <form class="activation-form" id="emailActivationForm" aria-label="Підтвердження email" hidden>
            <h2>Підтвердіть email</h2>
            <p>Ми надіслали шестизначний код на <strong id="activationEmail"></strong>.</p>
            <label>
              <span>Код активації</span>
              <input
                type="text"
                name="activationCode"
                inputmode="numeric"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                minlength="6"
                maxlength="6"
                placeholder="000000"
                required
              />
            </label>
            <button class="primary-button" type="submit">Підтвердити та завершити реєстрацію</button>
            <button class="ghost-button" id="changeRegistrationEmail" type="button">Змінити дані або надіслати код ще раз</button>
          </form>

          <p class="auth-status" id="authStatus" role="status"></p>
          <p class="auth-switch-link">Вже маєте акаунт? <a href="auth.php">Увійти</a></p>
        </section>
      </section>
    </main>

    <script src="auth-config.js?v=email-activation-20260920"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="register.js?v=email-activation-20260920"></script>
    <script src="session.js?v=roleless-users-20260920"></script>
  </body>
</html>
