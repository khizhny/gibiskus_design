<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Пошук фахівця - каталог фахівців</title>
    <meta
      name="description"
      content="Сайт пошуку спеціалістів для дітей з ООП"
    />
    <link rel="stylesheet" href="styles.css?v=heading-align-20260920" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Пошук фахівця, на головну">
        <span class="brand-logo" aria-hidden="true"><img src="assets/logo.png" alt="" /></span>
      </a>
      <button class="menu-button icon-button" type="button" data-menu-toggle aria-label="Відкрити меню">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" data-nav>
        <a class="is-active" href="index.html">Шукаю фахівця</a>
        <a href="specialists.html">Я фахівець</a>
        <a href="about.html">Про сайт</a>
        <a href="admin.html">Адміністратор</a>
      </nav>
      <div class="header-actions">
        <a class="ghost-button" href="register.php" data-registration-link>Реєстрація</a>
        <a class="ghost-button" href="auth.php">Увійти</a>
      </div>
    </header>

    <main>
      <section class="hero" id="catalog">
        <div class="hero-copy">
          <h1>Пошук фахівців для людей з ООП</h1>
          <form class="search-panel" id="searchForm" aria-label="Пошук фахівців">
            <label>
              <span>Область</span>
              <select id="regionFilter">
                <option value="all">Будь-яка область</option>
              </select>
            </label>
            <label>
              <span>Місто</span>
              <select id="cityFilter">
                <option value="all">Спочатку оберіть область</option>
              </select>
            </label>
            <label>
              <span>Район міста</span>
              <select id="districtFilter">
                <option value="all">Спочатку оберіть місто</option>
              </select>
            </label>
            <div class="form-field specialist-select-field">
              <span class="field-label">Спеціаліст</span>
              <details class="multi-select specialist-tree-select" id="specialistFilter">
                <summary><span data-specialist-summary>Будь-який спеціаліст</span></summary>
                <div class="multi-select-menu specialist-tree-menu" id="specialistTree"></div>
              </details>
            </div>
            <label class="format-select-field">
              <span>Формат</span>
              <details class="multi-select" id="formatFilter">
                <summary><span data-format-summary>Будь-який</span></summary>
                <div class="multi-select-menu">
                  <label class="multi-select-option">
                    <input type="checkbox" name="formatFilter" value="Онлайн" />
                    <span>Онлайн</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="formatFilter" value="У фахівця" />
                    <span>У фахівця</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="formatFilter" value="У учня" />
                    <span>У учня</span>
                  </label>
                </div>
              </details>
            </label>
            <label>
              <span>Рейтинг</span>
              <select id="ratingFilter">
                <option value="all">Будь-який</option>
                <option value="5">5.0</option>
                <option value="4.9">від 4.9</option>
                <option value="4.8">від 4.8</option>
                <option value="4.7">від 4.7</option>
              </select>
            </label>
          </form>
        </div>
      </section>

      <section class="catalog-layout catalog-layout-single" aria-label="Каталог оголошень">
        <section class="results-panel">
          <div class="results-head">
            <div>
              <p class="section-note">Знайдено <span id="resultCount">0</span> фахівців</p>
              <h2>Знайдені фахівці</h2>
            </div>
          </div>
          <div class="listing-list" id="listingList"></div>
        </section>

      </section>
    </main>

    <div class="modal" id="specialistModal" aria-hidden="true">
      <div class="modal-panel specialist-detail-panel" role="dialog" aria-modal="true" aria-labelledby="specialistDetailTitle">
        <button class="icon-button close-button" type="button" data-close-specialist aria-label="Закрити">×</button>
        <div id="specialistDetail"></div>
      </div>
    </div>

    <div class="drawer" id="messageDrawer" aria-hidden="true">
      <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
        <button class="icon-button close-button" type="button" data-close-drawer aria-label="Закрити">×</button>
        <p class="section-note">Повідомлення</p>
        <h2 id="drawerTitle">Написати фахівцю</h2>
        <div class="chat-thread" id="chatThread"></div>
        <form id="messageForm" class="message-form">
          <label>
            <span>Повідомлення</span>
            <textarea rows="4" placeholder="Коротко опишіть запит і зручний формат" required></textarea>
          </label>
          <button class="primary-button" type="submit">Надіслати</button>
          <p class="form-status" id="messageStatus" role="status"></p>
        </form>
      </div>
    </div>

    <script src="script.js?v=listing-labels-20260921"></script>
    <script src="session.js?v=roleless-users-20260920"></script>
  </body>
</html>
